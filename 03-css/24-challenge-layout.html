<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Sprite CSS</title>
    <style>
        menu.options{
            a:link,
            a:visited{
                background-color: #fff9;
                color: #0009;
                padding: 0.4rem 0.8rem;
            }
            a:hover{
                background-color: #000000;
                color: #fff9;
            }
            a:active{
                background-color: rgb(52, 88, 60);
                color: #fff9;
            }
        }
        body{
            margin: 0;
            border: 10px solid #fff;
            background-color: #17a053;
            min-height: 100dvh;
            main{
                header{
                    figure.logo{
                        background: url(imgs/spriteweb.png) no-repeat;
                        background-position: -25px -420px;
                        height: 140px;
                        margin: 2rem auto;
                        width: 160px;
                    }
                    section{
                        text-align: center;
                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <main>
        <header>
            <figure class="logo"></figure>
            <section>
            <menu class="options">
                <a href="#">INICIO</a>
                <a href="#">NOSOTROS</a>
                <a href="#">PORTAFOLIO</a>
                <a href="#">SERVICIOS</a>
                <a href="#">CONTACTO</a>
            </menu>
            </section>
        </header>
    </main>
    <section>
        
    </section>
</body>
</html>
